<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIKI Dashboard</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
header h1{font-size:16px;color:var(--accent)}
#health-pill{font-size:12px;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--dim)}
#health-pill.ok{color:var(--ok);border-color:var(--ok)}
#health-pill.degraded{color:var(--warn);border-color:var(--warn)}
main{flex:1;display:flex;min-height:0}
#chat-col{flex:2;display:flex;flex-direction:column;border-right:1px solid var(--border)}
#log{flex:1;overflow-y:auto;padding:16px}
.msg{margin-bottom:12px;max-width:85%;padding:8px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
.msg.user{background:#1f3a5f;margin-left:auto}
.msg.viki{background:var(--panel);border:1px solid var(--border)}
.msg.err{border:1px solid var(--warn);color:var(--warn)}
#composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
#composer input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 12px;outline:none}
#composer input:focus{border-color:var(--accent)}
button{background:var(--accent);border:0;border-radius:6px;color:#0d1117;font-weight:600;padding:8px 16px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#side{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;min-width:280px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:8px}
.card ul{list-style:none;font-size:13px}
.card li{padding:3px 0;border-bottom:1px solid var(--border)}
.card li:last-child{border:0}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.kv span:last-child{color:var(--dim);text-align:right;max-width:60%}
#mem-form{display:flex;gap:6px;margin-bottom:8px}
#mem-form input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;outline:none}
.dim{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>VIKI</h1>
  <span id="health-pill">loading…</span>
  <span class="dim" id="model-label"></span>
</header>
<main>
  <div id="chat-col">
    <div id="log"><div class="msg viki">Dashboard online. Ask me anything.</div></div>
    <form id="composer">
      <input id="box" autocomplete="off" placeholder="Message VIKI…" autofocus>
      <button id="send" type="submit">Send</button>
    </form>
  </div>
  <div id="side">
    <div class="card"><h2>Runtime health</h2><div id="health-body" class="dim">loading…</div></div>
    <div class="card"><h2>Mission</h2><div id="mission-body" class="dim">none</div></div>
    <div class="card">
      <h2>Memory search</h2>
      <form id="mem-form"><input id="mem-q" placeholder="Search lessons…"><button type="submit">Go</button></form>
      <ul id="mem-results"><li class="dim">no query yet</li></ul>
    </div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};

function addMsg(text, cls){
  const div=document.createElement('div');
  div.className='msg '+cls;
  div.textContent=text;
  $('log').appendChild(div);
  $('log').scrollTop=$('log').scrollHeight;
  return div;
}

let ws=null;
let chatPending=null;

function connectWs(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host+'/api/ws/chat');
  ws.onopen=()=>console.log('WS chat connected');
  ws.onclose=()=>{console.log('WS chat disconnected');setTimeout(connectWs,3000)};
  ws.onerror=()=>{};
  ws.onmessage=e=>{
    try{
      const m=JSON.parse(e.data);
      if(m.type==='partial'){
        if(chatPending) chatPending.textContent+=m.data;
      }else if(m.type==='thought'||m.type==='status'){
        // silently consume status updates
      }else if(m.type==='done'){
        if(chatPending) chatPending.className='msg viki';
        chatPending=null;
        $('send').disabled=false;
        $('box').focus();
      }else if(m.type==='error'){
        if(chatPending){chatPending.textContent+='\nError: '+m.data;chatPending.className='msg err'}
        chatPending=null;
        $('send').disabled=false;
      }
    }catch(e){/*ignore*/}
  };
}
connectWs();

$('composer').addEventListener('submit', async e=>{
  e.preventDefault();
  const text=$('box').value.trim();
  if(!text) return;
  $('box').value='';
  addMsg(text,'user');
  $('send').disabled=true;
  chatPending=addMsg('','viki');
  if(ws&&ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({text}));
  }else{
    // fallback to REST
    try{
      const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
      const data=await r.json();
      chatPending.textContent = data.reply ?? ('Error: '+(data.error||r.status));
      if(!data.reply) chatPending.className='msg err';
    }catch(err){
      chatPending.textContent='Request failed: '+err;
      chatPending.className='msg err';
    }finally{
      chatPending=null;
      $('send').disabled=false;
      $('box').focus();
    }
  }
});

$('mem-form').addEventListener('submit', async e=>{
  e.preventDefault();
  const q=$('mem-q').value.trim();
  if(!q) return;
  const ul=$('mem-results');
  ul.innerHTML='<li class="dim">searching…</li>';
  try{
    const r=await fetch('/api/memory?q='+encodeURIComponent(q));
    const data=await r.json();
    ul.innerHTML=(data.lessons&&data.lessons.length)
      ? data.lessons.map(l=>'<li>'+esc(l)+'</li>').join('')
      : '<li class="dim">no matches</li>';
  }catch(err){
    ul.innerHTML='<li class="dim">error: '+esc(String(err))+'</li>';
  }
});

async function refresh(){
  try{
    const h=await (await fetch('/api/health')).json();
    const pill=$('health-pill');
    pill.textContent=h.degraded?'degraded':'healthy';
    pill.className=h.degraded?'degraded':'ok';
    $('model-label').textContent=h.default_model?('model: '+h.default_model):'';
    $('health-body').innerHTML=
      '<div class="kv"><span>Skills</span><span>'+h.registered_skill_count+'</span></div>'+
      '<div class="kv"><span>Models up</span><span>'+(h.available_models||[]).length+'</span></div>'+
      '<div class="kv"><span>Models down</span><span>'+Object.keys(h.unavailable_models||{}).length+'</span></div>'+
      ((h.warnings||[]).map(w=>'<div class="kv"><span>⚠</span><span>'+esc(w)+'</span></div>').join(''));
  }catch(e){ $('health-pill').textContent='offline'; $('health-pill').className=''; }
  try{
    const m=await (await fetch('/api/mission')).json();
    $('mission-body').textContent=m.active_mission
      ? (m.active_mission.goal+' ['+m.active_mission.phase+']')
      : 'no active mission';
  }catch(e){ /* ignore */ }
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
