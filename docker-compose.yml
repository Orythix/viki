# VIKI CLI — run the sovereign agent engine in Docker with a local LLM provider (e.g., LM Studio or NVIDIA NIM).
# Usage:
#   docker compose run --rm viki                    # One-shot CLI command
#   docker compose run --rm -it viki                 # Interactive CLI session
#   docker compose up -d                             # Detached (if running as service)

services:
  viki:
    build: .
    image: viki-sdi:latest
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      VIKI_DATA_DIR: /app/data
      VIKI_WORKSPACE_DIR: /app/workspace
      VIKI_TRUST_WORKSPACE: "true"
      VIKI_OLLAMA_THINK: "false" # Keep this for now, but it should be updated to reflect the new provider's thinking flag.
      VIKI_LOG_LEVEL: "INFO"
      # LM Studio Host (Windows/Mac). On Linux use network_mode: host or set to host IP.
      LMSTUDIO_HOST: http://host.docker.internal:1234 # Assuming a default port for LM Studio
    volumes:
      - ./data-docker:/app/data
      - ./workspace:/app/workspace
      - ./logs:/app/logs
      - ./config:/host-config
