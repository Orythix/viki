name: Security Lab

on:
  push:
    paths:
      - "labs/security-lab/**"
      - ".github/workflows/security-lab.yml"
  pull_request:
    paths:
      - "labs/security-lab/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: labs/security-lab/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r labs/security-lab/backend/requirements.txt

      - name: Pytest
        run: pytest labs/security-lab/tests -q --tb=short
