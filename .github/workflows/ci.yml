# Continuous integration: tests and lint on pull requests and main branch pushes.

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Validate imports
        run: python scripts/validate_imports.py || echo "Import validation script not found (optional)"

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Ollama-backed cases need a running Ollama; run locally with models up.
      - name: Pytest (quick)
        run: >
          pytest tests/ -q --tb=short --timeout=120
          --ignore=tests/test_viki_integration.py
          -k "not test_learning_cycle"
        env:
          VIKI_SKIP_STARTUP_PULSE: "1"
          VIKI_LOW_RESOURCE: "1"
          VIKI_AIR_GAP: "1"
          VIKI_LOCAL_LLM_ONLY: "1"

  # Optional: static analysis only on Python 3.11 to save CI minutes.
  typecheck:
    runs-on: ubuntu-latest
    if: false  # disabled until mypy or pyright is configured
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" mypy
      - run: mypy core/
