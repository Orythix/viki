name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: pip install ruff mypy pydantic types-requests types-PyYAML

      - name: Ruff check
        run: ruff check src/viki/
      - name: Ruff format check
        run: ruff format --check src/viki/
      - name: Mypy check
        run: mypy src/viki/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install project
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest tests/ -m "not nightly" --timeout=120 -q
      - name: Coverage
        run: uv run pytest tests/ -m "not nightly" --timeout=120 -q --cov=src/viki --cov-report=xml --cov-fail-under=40
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --strict


  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full image
        run: docker build -t viki:latest .
      - name: Build slim image
        run: docker build --target=slim -t viki:slim .
      - name: Smoke test slim image
        run: docker run --rm viki:slim viki --version
