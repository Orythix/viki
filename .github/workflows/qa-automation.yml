# Multi-stack QA learning track:
# - Python unit tests (always)
# - Java / Maven (always)
# - k6 public API smoke (always)
# - Playwright: installs browsers; UI tests skip unless QA_UI_LIVE=1 (set repo variable to enable)

name: QA Automation (learning track)

on:
  push:
    paths:
      - "labs/qa-automation/**"
      - ".github/workflows/qa-automation.yml"
  pull_request:
    paths:
      - "labs/qa-automation/**"

jobs:
  qa-python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: labs/qa-automation/requirements.txt

      - name: Install dependencies
        run: pip install -r labs/qa-automation/requirements.txt

      - name: Pytest (unit only)
        run: pytest labs/qa-automation/tests/unit -q --tb=short --junitxml=qa-python-junit.xml

      - name: Upload Python JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-python-junit
          path: qa-python-junit.xml

  qa-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven test
        run: mvn -B -f labs/qa-automation/tracks/java-api/pom.xml test

  qa-k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 smoke (public demo API)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: labs/qa-automation/tracks/performance/k6-ci-smoke.js

  qa-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: labs/qa-automation/tracks/ui-playwright/package-lock.json

      - name: Install UI deps
        working-directory: labs/qa-automation/tracks/ui-playwright
        run: |
          npm install
          npx playwright install chromium

      - name: Playwright test (set QA_UI_LIVE=1 + Vite job to enable UI assertions)
        working-directory: labs/qa-automation/tracks/ui-playwright
        env:
          QA_UI_LIVE: "0"
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: labs/qa-automation/tracks/ui-playwright/playwright-report
