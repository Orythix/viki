name: Nightly Eval

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install uv
          uv sync --group dev

      # Deterministic smoke tier: always runs, proves the harness end-to-end
      # and produces a capability-index artifact even without model access.
      - name: Harness smoke (MockLLM)
        run: uv run viki-eval --mock --no-llm-judge --limit 5 --results-dir data/eval_results_smoke

      # Real-model tier: only when the OpenCode key is configured as a repo secret.
      # This is the run that actually measures model quality over time.
      - name: Nightly eval (OpenCode DeepSeek V4 Flash)
        if: env.OPENCODE_API_KEY != ''
        run: uv run viki-eval --no-llm-judge --limit 10 --concurrency 2 --timeout 120
        continue-on-error: true

      # Scorecard + promotion gate artifact: refuse forge promotion when CI delta <= 0.
      - name: Write scorecard trends artifact
        if: always()
        run: |
          uv run python - <<'PY'
          import json, os, time
          from pathlib import Path
          roots = ["data/eval_results", "data/eval_results_smoke"]
          artifact = {
              "computed_at": time.time(),
              "indexes": {},
              "promotion_rule": "refuse_when_capability_delta_le_0",
          }
          try:
              from viki.core.capability_index import CapabilityIndex
              for root in roots:
                  if os.path.isdir(root):
                      artifact["indexes"][root] = CapabilityIndex(root).compute()
          except Exception as e:
              artifact["error"] = str(e)
          Path("data").mkdir(exist_ok=True)
          Path("data/scorecard_nightly.json").write_text(json.dumps(artifact, indent=2))
          print(json.dumps(artifact.get("indexes", {}), indent=2)[:2000])
          PY

      - name: Upload capability index and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: |
            data/eval_results/capability_index.json
            data/eval_results/**/*.jsonl
            data/eval_results_smoke/capability_index.json
            data/scorecard_nightly.json
          retention-days: 90
          if-no-files-found: warn
