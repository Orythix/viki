models:
  budget:
    daily_usd_cap: 5.0
    per_call_usd_cap: 0.5
    explicit_cloud_only: false
    per_provider_daily_cap:
      openai: 3.0
      anthropic: 3.0
      gemini: 3.0
      mistral: 1.5
      groq: 1.5
      bedrock: 3.0
  providers:
    ollama:
      type: local
      base_url: http://127.0.0.1:11434
    openai:
      type: api
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
    anthropic:
      type: api
      base_url: https://api.anthropic.com/v1
      api_key_env: ANTHROPIC_API_KEY
    gemini:
      type: gemini
      api_key_env: GOOGLE_API_KEY
    groq:
      type: groq
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
    mistral:
      type: mistral
      base_url: https://api.mistral.ai/v1
      api_key_env: MISTRAL_API_KEY
    bedrock:
      type: bedrock
      region: us-east-1
    mock:
      type: mock
  default: viki-evolved
  profiles:
    qwen35:
      provider: ollama
      model_name: qwen3.5:latest
      temperature: 0.5
      priority: 3
      capabilities:
      - general
      - reasoning
      - coding
      - analysis
      - fast_response
      - researching
      - chatter
      - tool_use
      - planning
      supports_native_tools: false
      description: "Qwen 3.5 \u2014 primary local generalist when pulled as qwen3.5:latest."
    gemma4:
      provider: ollama
      model_name: gemma4:latest
      temperature: 0.5
      priority: 2
      capabilities:
      - general
      - reasoning
      - chatter
      - analysis
      - fast_response
      supports_native_tools: false
      description: "Gemma 4 \u2014 local alternative when pulled as gemma4:latest."
    viki-evolved:
      provider: ollama
      model_name: viki-born-again
      temperature: 0.6
      priority: 3
      capabilities:
      - general
      - reasoning
      - coding
      - analysis
      - fast_response
      - researching
      - chatter
      - tool_use
      supports_native_tools: false
      description: VIKI Modelfile image (viki-born-again) with baked-in lessons after
        internal_forge.
    phi3:
      provider: ollama
      model_name: phi3:latest
      temperature: 0.1
      priority: 1
      capabilities:
      - reflex
      - fast_response
      supports_native_tools: false
      description: Phi-3 - Microsoft's compact model. Use for SHALLOW/REFLEX intent
