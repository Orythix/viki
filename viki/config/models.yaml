models:
  providers:
    ollama:
      type: local
      base_url: http://localhost:11434
    openai:
      type: api
      api_key: ${OPENAI_API_KEY}
    anthropic:
      type: anthropic
      api_key: ${ANTHROPIC_API_KEY}
    mock:
      type: mock
  default: viki-base
  profiles:
    qwen35:
      provider: ollama
      model_name: qwen3.5:latest
      priority: 4
      capabilities:
      - chat
      - reasoning
      - tool_use
      supports_native_tools: true
      description: Primary local model for all tasks.
    viki-trainer:
      provider: ollama
      model_name: qwen3.5:latest
      training_only: true
      priority: 1
      capabilities:
      - training
      description: Dedicated training/evolution persona.
    viki-evolved:
      provider: ollama
      model_name: viki-evolved:latest
      priority: 3
      capabilities:
      - chat
      - sovereign
      description: The evolved version of VIKI with baked-in knowledge.
  budget:
    monthly_limit_usd: 5.0
    warning_threshold_usd: 3.5
