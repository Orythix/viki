[project]
name = "viki-sdi"
version = "8.3.0"
description = "VIKI - Virtual Intelligence Knowledge Integrator: an open-source autonomous AI assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "VIKI Project Contributors" },
]
keywords = [
    "ai", "assistant", "agent", "ollama", "local-llm", "autonomous",
    "rag", "privacy", "cli", "neural-forge", "open-source",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "prompt-toolkit>=3.0.0",
    "pyperclip>=1.8.0",
    "sqlite-utils>=3.35.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.24.0",
    "watchdog>=3.0.0",
    # zoneinfo has no system tz database to fall back to on Windows
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
viki = "viki.cli:run"

[project.urls]
Homepage = "https://github.com/Orythix/viki"
Repository = "https://github.com/Orythix/viki"
Documentation = "https://github.com/Orythix/viki/blob/main/docs/DOCUMENTATION.md"
Changelog = "https://github.com/Orythix/viki/blob/main/CHANGELOG.md"
Issues = "https://github.com/Orythix/viki/issues"

[project.optional-dependencies]
# Semantic embeddings, reranking, and model training (forge/LoRA/DPO).
# Without this extra, VIKI falls back to keyword search and disables training skills.
ml = [
    "sentence-transformers>=2.2.0",
    "huggingface-hub>=0.20.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "accelerate>=0.25.0",
    "peft>=0.7.0",
    "trl>=0.7.0",
    "datasets>=2.16.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.package-data]
viki = ["api/static/*.html", "data/sovereign_library.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
# playbooks/ is vendored content (docs plus example snippets), not project code
extend-exclude = ["playbooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "BLE", # flake8-blind-except (except Exception, except BaseException)
    "PIE", # flake8-pie
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments (intentional in some cases)
    "T201",  # print statements (used for debug)
    "TRY003", # avoid bare except (too many to fix now)
    "BLE001", # blind except Exception (legacy codebase, 500+ occurrences)
]
per-file-ignores = { "tests/*" = ["S101", "T201", "E402"], "src/viki/skills/**" = ["T201", "E701", "E402", "E741", "B904", "B008"], "src/viki/evolution_engine.py" = ["E402"], "src/viki/core/vector_memory.py" = ["B904"], "src/viki/core/inference_gateway.py" = ["B904"], "src/viki/core/autonomous_monitor.py" = ["E741"], "src/viki/core/continuous_learning.py" = ["E741"], "src/viki/ops/tenant_ops.py" = ["E741"], "src/viki/application/**" = ["E741"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
files = ["src/viki"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = [
  "src/viki/evolution_engine.py",
  "skill-comply",
]

[[tool.mypy.overrides]]
module = "viki.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/viki"]
omit = ["tests/*", "*/playbooks/**"]

[tool.coverage.report]
fail_under = 20
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "coverage_html"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
