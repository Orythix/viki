[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viki-sdi"
version = "8.2.0"
description = "VIKI Sovereign Digital Intelligence — open-source self-hosted AI agent: Ollama local LLMs, Python CLI, MCP tools, RAG memory, Neural Forge, capability gating, Apache-2.0"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "VIKI Project Contributors" },
]
urls = { Homepage = "https://github.com/Orythix/viki", Changelog = "https://github.com/Orythix/viki/blob/main/CHANGELOG.md", Issues = "https://github.com/Orythix/viki/issues" }
requires-python = ">=3.10"
keywords = [
    "ai-agent",
    "open-source-ai-agent",
    "self-hosted-ai",
    "autonomous-agent",
    "ollama",
    "local-llm",
    "private-llm",
    "privacy-first",
    "sovereign-ai",
    "cli-agent",
    "mcp",
    "rag",
    "orythix",
    "cognitive-architecture",
    "tool-use",
    "cli-assistant",
    "python",
    "ai-assistant",
    "llm-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "requests",
    "rich",
    "colorama",
    "tqdm",
    "psutil",
    "sqlite-utils",
    "openai",
    "instructor",
    "anthropic",
    "ollama",
    "sentence-transformers",
    "duckduckgo-search",
    "numpy",
    "scipy",
    "torch",
    "torchaudio",
    "pillow",
    "opencv-python",
    "playwright",
    "watchdog",
    "pyautogui",
    "pyperclip",
    "pyttsx3",
    "beautifulsoup4",
    "aiohttp",
    "sounddevice",
    "python-telegram-bot",
    "discord.py",
    "pandas",
    "openpyxl",
    "matplotlib",
    "python-pptx",
    "dependency-injector",
    "sqlalchemy",
    "rank_bm25",
    "prompt-toolkit",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "ruff"]
# Model Context Protocol (remote stdio/http/sse servers). See viki/config/mcp_servers.yaml.
mcp = ["mcp>=1.12.0"]
# Optional stacks (install on top of the base package). See README "Install profiles".
windows = ["pypiwin32"]
optional-network = ["scapy"]
vad = ["silero-vad"]
qt = ["PyQt5"]
embeddings = ["sentence-transformers", "torch", "torchaudio"]
browser = ["playwright"]
vision = ["opencv-python"]
agent-full = [
    "sentence-transformers",
    "torch",
    "torchaudio",
    "playwright",
    "opencv-python",
    "watchdog",
    "pyautogui",
    "pyperclip",
    "pyttsx3",
    "sounddevice",
    "python-telegram-bot",
    "discord.py",
    "pandas",
    "openpyxl",
    "matplotlib",
    "python-pptx",
    "duckduckgo-search",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# CI: catch likely bugs without requiring a full style pass on legacy code.
select = ["F821", "F822", "F823", "F632"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["./tests"]
pythonpath = ["."]
timeout = 120
timeout_method = "thread"

[project.scripts]
viki = "bootstrap:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "application*", "domain*", "infrastructure*", "integrations*", "skills*", "ui*"]
