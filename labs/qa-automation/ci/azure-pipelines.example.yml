# Azure DevOps — example multi-stack QA stage (copy to your pipeline).
# Rename to azure-pipelines.yml and wire to your repo.

trigger:
  branches:
    include: [main]
  paths:
    include:
      - labs/qa-automation/*

pool:
  vmImage: ubuntu-latest

stages:
  - stage: QA_Learning
    jobs:
      - job: PythonUnit
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"
          - script: pip install -r labs/qa-automation/requirements.txt && pytest labs/qa-automation/tests/unit -q --junitxml=junit.xml
            displayName: Pytest unit
          - task: PublishTestResults@2
            inputs:
              testResultsFiles: junit.xml
            condition: always()

      - job: JavaUnit
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: labs/qa-automation/tracks/java-api/pom.xml
              goals: test

      - job: K6Smoke
        steps:
          - script: |
              sudo gpg -k
              sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
              echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
              sudo apt-get update
              sudo apt-get install k6
            displayName: Install k6
          - script: k6 run labs/qa-automation/tracks/performance/k6-ci-smoke.js
            displayName: k6 public API smoke
