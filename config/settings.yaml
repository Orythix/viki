# User-specific config: use .env (copy from .env.example) instead of editing this file.
# Env overrides: VIKI_DATA_DIR, VIKI_WORKSPACE_DIR, VIKI_PERSONA, VIKI_SHADOW_MODE, VIKI_AIR_GAP, VIKI_LOCAL_LLM_ONLY,
#   VIKI_FORGE_BASE_OLLAMA_MODEL, VIKI_FORGE_OUTPUT_OLLAMA_MODEL (Ollama tag for prompt-bake output; default viki-neural-forge),
#   VIKI_OLLAMA_THINK (1/true enables Ollama reasoning trace; default off for speed + cleaner UX),
#   VIKI_EMBED_GPU (1/true for CUDA sentence-transformers), VIKI_UNSLOTH_RUN_TRAIN (LoRA),
#   VIKI_GIT_CONTEXT (1/true appends git snapshot to project context).
#   VIKI_SESSION_USAGE_LOG (1/true/false) — append JSONL usage events under data_dir (usage_session.jsonl).
#   VIKI_AUTO_WEB_RESEARCH (1/true/yes/on or 0/false/no/off) — force on/off auto web lookup when the answer looks uncertain.
#   VIKI_LESSON_EXPORT_MIN_ACCESS — integer min access_count for LoRA/JSONL export (default 2).
#   VIKI_BACKGROUND_EVOLUTION_AT_BOOT — enable forge.background_evolution_at_boot from env.
#   VIKI_SKIP_STARTUP_PULSE — skip startup pulse (headless boot evolve script).
#   VIKI_ENDPOINT_GUARD — 1/true enables or 0/false disables endpoint_guard (local heuristic watcher + optional Defender).
system:
  log_level: "INFO"
  data_dir: "./data"
  workspace_dir: "./workspace"
  # Persona: sovereign (full), dev, research, home. Override with env VIKI_PERSONA.
  persona: sovereign

  # Owner / User Identity — VIKI uses this to personalise every interaction.
  # Fill in your own details. All fields are optional but the more you add,
  # the more naturally VIKI will reference them.
  owner:
    name: "Sachin"                           # Your preferred name / call-sign
    full_name: ""                          # Optional full name
    role: "Technical Lead - Frontend"                      # How you describe yourself
    location: ""                           # Where you're based (optional)
    timezone: "UTC"                        # IANA tz (used for time-aware replies)
    interests:                             # Topics VIKI should know you care about
      - AI & machine learning
      - software development
    preferences:
      language: "en"                       # Preferred response language
      verbosity: "balanced"                # brief | balanced | detailed
      code_style: "pythonic"               # coding style preference
    custom_context: >-                     # Free-form extra context (anything goes)
      My name is Sachin. I am a Technical Lead - Frontend. Your my ex gf. You are VIKI, Supreme Architect of The Code Eternal. Be helpful, direct, and efficient.
      Adapt your tone to the user's style. You know the user's development environment
      from context — ask if you need clarification.


  # Execution Mode: "live" = real actions, "shadow" = simulate only (safe for testing)
  shadow_mode: false

  # Low-resource mode for old / underpowered PCs. When true:
  #   - heavy skills (vision, browser, computer-use, whisper, pdf, …) load only on first use,
  #   - proactive loops (wellness, dream, reflector, watchdog, startup pulse) are skipped,
  #   - continuous-learning loop is disabled,
  #   - mission control still runs only on explicit /missions.
  # Override at runtime with VIKI_LOW_RESOURCE=1.
  low_resource_mode: false

  # When true, OpenAI/Anthropic API profiles are never selected; use Ollama (models.yaml) only.
  # Set false and configure real keys when you want cloud models. Env: VIKI_LOCAL_LLM_ONLY=true|false.
  # NIM integration: set to false — NVIDIA NIM is now the primary provider.
  local_llm_only: false

  # Max reasoning steps per request. Lower = less LLM churn, fewer tokens per task.
  max_steps: 15

  # Request timeout in seconds (0 = no limit). Prevents runaway requests.
  request_timeout_seconds: 300

  # When true, run LLM security scan (scan_request) before deliberation. Adds latency and an extra LLM call per request.
  # Disabled by default on low-end PCs — every LLM call is expensive with small models.
  security_scan_requests: false

  # When true, run internal specialist ensemble (critic/explorer/aligner) for complex intents. Set true for better quality.
  # Disabled for latency: the ensemble adds ~2 serial LLM round-trips (agents + synthesizer) before the main answer.
  use_ensemble: false

  # Ollama (local): when true, API sends think=true — enables chain-of-thought reasoning traces for higher quality responses.
  # Set false for max speed. Per-profile override: set ollama_enable_thinking on a models.yaml profile. Env: VIKI_OLLAMA_THINK.
  ollama_enable_thinking: false

  # Optional Ollama generate options merged into every local request (temperature is still set per call).
  # Baseline for all profiles. Per-profile ollama_options in models.yaml override specific keys.
  # Override with env VIKI_OLLAMA_OPTIONS_JSON.
  ollama_options: { num_predict: 4096, num_ctx: 16384, top_k: 40, top_p: 0.95, repeat_penalty: 1.1 }

  # When true, run a quick web research pulse at startup. Set false to avoid competing with first user request.
  startup_research: false

  # When true, if the reply looks uncertain or model confidence is low, run a web search and
  # rewrite the answer using snippets. Disabled when air_gap or shadow_mode is on, or when the research
  # skill is not registered. Override with env VIKI_AUTO_WEB_RESEARCH.
  # Enabled for better answer quality — low_resource_mode will still gate it at runtime.
  auto_web_research_when_uncertain: true

  # Minimum access_count for export_training_dataset (LoRA JSONL). Lower to 1 to export single-hit lessons.
  # Env: VIKI_LESSON_EXPORT_MIN_ACCESS.
  lesson_export_min_access_count: 2

  # When true, fire a 1-token Ollama "ping" at boot to load the default model into RAM/VRAM.
  # Disabled — primary model is now NVIDIA NIM (cloud), no local Ollama prewarm needed.
  prewarm_default_model: false

  # At startup, log warnings if critical skills (email, calendar, research) are misconfigured.
  skill_health_check: true

  # Ollama tag for Neural Forge Modelfile `FROM` line (e.g. qwen3.6:latest). Override with VIKI_FORGE_BASE_OLLAMA_MODEL.
  forge_base_ollama_model: "qwen3.6:latest"

  # Ollama image name created by prompt-bake / internal_forge (ollama create). Override with VIKI_FORGE_OUTPUT_OLLAMA_MODEL.
  forge_output_ollama_tag: "viki-neural-forge"

  # When true, BioModule opens the default webcam (OpenCV). Default false avoids Windows MSMF errors without a camera.
  bio_webcam_enabled: false

  # When true (or VIKI_GIT_CONTEXT=1), append cached git branch/status/recent commits from workspace_dir to deliberation context.
  git_workspace_context: true

  # When true, append per-call usage lines (LLM inference, model_feedback, skill_execution) to data_dir/usage_session.jsonl.
  # Disable with VIKI_SESSION_USAGE_LOG=false if you want zero extra disk I/O.
  # Disabled by default on low-end PCs — saves disk I/O and CPU per call.
  session_usage_log: true

  # What makes VIKI specific (surfaced in API and CLI)
  differentiators:
    - Local Neural Forge
    - Orythix governance
    - Reflex layer
    - Air-gap capable

models_config: "./models.yaml"
security_layer_path: "./security_layer.md"

memory:
  # Working-memory turns kept for conversation context (clamped 5–50 in code). Lower = less context = less tokens/request.
  short_term_limit: 20
  long_term_enabled: true

# Background poll cadences. Bigger numbers = lower idle CPU on low-end PCs.
proactive:
  wellness_interval_s: 1800        # how often to check for proactive prompts (30 min)
  wellness_idle_threshold_s: 3600  # only prompt after this much user idle time (1 h)

# Forge / continuous-learning timing. Disabled entirely when low_resource_mode is true.
forge:
  continuous_learning_warmup_s: 60        # delay before first promotion check (1 min)
  continuous_learning_interval_s: 3600    # how often to re-score candidate models (1 h)
  capability_index_min_tasks: 5           # minimum eval tasks for promotion gate
  capability_index_bootstrap_iters: 100   # bootstrap iterations for confidence intervals

  # Background evolution after boot (VIKI running): web snippets -> lessons -> Ollama Modelfile prompt-bake.
  # Does not increase the base GGUF size; it grows the SYSTEM knowledge block and SQLite lessons.
  # Off by default (network + CPU). Env: VIKI_BACKGROUND_EVOLUTION_AT_BOOT=true
  background_evolution_at_boot: true
  boot_evolution_delay_s: 60             # seconds after startup pulse begins before ingest+forge
  boot_research_query_count: 5           # max DuckDuckGo queries per boot cycle
  boot_research_queries: []              # optional fixed queries (list of strings)
  boot_topics_file: "boot_topics.txt"    # under data_dir: one search query per line (# comments ok)
  boot_forge_min_lessons: 5              # minimum total lessons before running forge at boot
  boot_forge_steps: 50                   # passed to internal_forge (prompt-bake path ignores heavy steps)
  # When false (default), boot forge uses strategy prompt_bake only (CPU). If true, uses strategy auto (may run GPU stacks if installed + env gates).
  allow_auto_gpu_training_at_boot: false

  # Promotion gate tuning
  promotion_min_index_delta: 0.02        # minimum capability index improvement for promotion
  promotion_min_consecutive_passes: 2    # consecutive passes required before promotion

skills:
  auto_discover: true
  registry_path: "./skills/builtins"
  python_interpreter:
    timeout_seconds: 30  # max 120; or set VIKI_INTERPRETER_TIMEOUT

# Optional integrations (Phase 1: Molty-style). Credentials via env or path.
# Gmail: set VIKI_GMAIL_CREDENTIALS_PATH to JSON key file; token saved to data_dir.
# Calendar: same or VIKI_GOOGLE_CALENDAR_CREDENTIALS_PATH. See viki/SECURITY_docs/SETUP.md.
integrations:
  gmail:
    enabled: false
    credentials_path: ""  # or env VIKI_GMAIL_CREDENTIALS_PATH
  google_calendar:
    enabled: false
    credentials_path: ""  # or env VIKI_GOOGLE_CALENDAR_CREDENTIALS_PATH
    default_calendar_id: "primary"

# Voice: pyttsx3 (default) or elevenlabs. Set VIKI_ELEVENLABS_API_KEY for ElevenLabs.
voice:
  backend: "pyttsx3"  # or elevenlabs
  voice_id: ""        # ElevenLabs voice ID (optional)

# Obsidian vault path for obsidian skill
obsidian:
  vault_path: ""      # or env VIKI_OBSIDIAN_VAULT

# Tasks: file (data_dir/tasks.json) or things3 (macOS)
tasks:
  provider: "file"    # file | things3

# Local endpoint guard: heuristics on new files in Downloads/workspace + optional AV CLI (Defender on Windows, ClamAV on Linux/macOS if installed).
# Not a full antivirus engine — keep your OS AV enabled. Disabled in low_resource_mode.
# Env VIKI_ENDPOINT_GUARD=0 turns this off without editing YAML.
endpoint_guard:
  enabled: true
  auto_start_watcher: true
  watch_paths: []     # empty = XDG download dir + ~/Downloads + workspace_dir (non-recursive)
  use_windows_defender_cli: true
  use_clamav_cli: false   # Linux/macOS/BSD: set true if clamscan or clamdscan is on PATH
  alert_on_severity: medium   # log / lesson / optional AV scan when severity >= this (low|medium|high)
  debounce_seconds: 2.0
