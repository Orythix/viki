models:
  providers:
    ollama:
      type: local
      base_url: http://localhost:11434
    openai:
      type: api
      api_key: ${OPENAI_API_KEY}
    anthropic:
      type: anthropic
      api_key: ${ANTHROPIC_API_KEY}
    nvidia_nim:
      type: nvidia_nim
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
    opencode_zen:
      type: opencode
      base_url: https://opencode.ai/zen/v1
      api_key_env: OPENCODE_API_KEY
    opencode_go:
      type: opencode
      base_url: https://opencode.ai/zen/go/v1
      api_key_env: OPENCODE_API_KEY
    mock:
      type: mock
  default: oc-deepseek-flash
  profiles:
    gemma4:
      provider: ollama
      model_name: gemma4:12b
      priority: 20
      timeout_seconds: 120
      max_context_tokens: 32768
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - general
      supports_native_tools: false
      supports_streaming: true
      local_first: true
      ollama_options:
        num_predict: 2048
        num_ctx: 8192
      description: 'Local Ollama fallback (offline / air-gap only). Primary is now NVIDIA NIM.

        '
    viki-evolved:
      provider: ollama
      model_name: gemma4:12b
      priority: 18
      timeout_seconds: 180
      max_context_tokens: 32768
      capabilities:
      - chat
      - reasoning
      - sovereign
      - memory
      - autonomous_planning
      - general
      supports_native_tools: false
      supports_streaming: true
      ollama_options:
        num_predict: 4096
        num_ctx: 16384
      description: 'Local Ollama fallback for evolved VIKI persona (offline only).

        '
    phi3-mini:
      provider: ollama
      model_name: phi3:mini
      priority: 10
      timeout_seconds: 60
      max_context_tokens: 8192
      capabilities:
      - chat
      - general
      supports_streaming: true
      tier: local_fast
      ollama_enable_thinking: false
      ollama_options:
        num_predict: 1024
        num_ctx: 4096
      description: 'Local Ollama lightweight fallback (offline only). NIM handles fast tasks via nim-nemotron-nano.

        '
    viki-trainer:
      provider: ollama
      model_name: gemma4:12b
      training_only: true
      priority: 10
      timeout_seconds: 300
      capabilities:
      - training
      - dataset_generation
      - self_reflection
      description: 'Dedicated training and evolutionary refinement model.

        '
    gpt-5:
      provider: openai
      model_name: gpt-5
      priority: 50
      fallback: true
      capabilities:
      - reasoning
      - coding
      - planning
      - tool_use
      supports_native_tools: true
      supports_streaming: true
      description: 'Cloud reasoning fallback model for difficult tasks.

        '
    claude-sonnet:
      provider: anthropic
      model_name: claude-sonnet-4
      priority: 40
      fallback: true
      capabilities:
      - reasoning
      - writing
      - analysis
      supports_streaming: true
      description: 'Long-context analysis and writing model.

        '

    # --- NVIDIA NIM profiles -------------------------------------------
    # NOTE: Some NVIDIA-hosted models (e.g. nvidia/llama-3.1-nemotron-ultra-253b-v1)
    # require account-level activation at https://build.nvidia.com before use.
    # The profiles below use universally accessible models by default.
    # To switch to a gated model, update model_name and visit build.nvidia.com to enable it.
    nim-nemotron:
      provider: nvidia_nim
      model_name: nvidia/llama-3.3-nemotron-super-49b-v1
      priority: 100
      timeout_seconds: 120
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - analysis
      - planning
      - general
      - chatter
      - sovereign
      - memory
      - autonomous_planning
      supports_native_tools: true
      supports_streaming: true
      cost_per_1k_in: 0.0004
      cost_per_1k_out: 0.0012
      description: 'FALLBACK — NVIDIA NIM Nemotron Super 49B. Backup cloud model;
        primary is OpenCode DeepSeek V4 Flash (oc-deepseek-flash).

        '

    nim-qwen-coder:
      provider: nvidia_nim
      model_name: qwen/qwen2.5-coder-32b-instruct
      priority: 95
      tier: heavy
      timeout_seconds: 180
      max_context_tokens: 32768
      capabilities:
      - coding
      - reasoning
      - analysis
      - tool_use
      supports_streaming: true
      cost_per_1k_in: 0.0002
      cost_per_1k_out: 0.0002
      description: 'NVIDIA NIM — Qwen2.5 Coder 32B. Heavy-tier target: the router
        prefers this profile when the judgment engine escalates to DEEP (complex
        coding/reasoning), while fast/standard traffic stays on Nemotron.

        '

    nim-nemotron-nano:
      provider: nvidia_nim
      model_name: nvidia/llama-3.1-nemotron-nano-8b-v1
      priority: 92
      tier: fast
      timeout_seconds: 30
      max_context_tokens: 131072
      capabilities:
      - chat
      - fast_response
      - general
      - chatter
      supports_streaming: true
      cost_per_1k_in: 0.0001
      cost_per_1k_out: 0.0001
      description: 'NVIDIA NIM — Nemotron Nano 8B. Primary fast-path model for reflex
        and lightweight tasks via NVIDIA free cloud inference.

        '

    nim-llama4:
      provider: nvidia_nim
      model_name: meta/llama-4-maverick-17b-128e-instruct
      priority: 90
      timeout_seconds: 60
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - vision
      - multimodal
      - tool_use
      supports_native_tools: true
      supports_streaming: true
      cost_per_1k_in: 0.0002
      cost_per_1k_out: 0.0006
      description: 'NVIDIA NIM — Llama 4 Maverick 17B (128 experts MoE). Primary
        multimodal / vision model via NVIDIA free cloud inference.

        '

    nim-llama-fast:
      provider: nvidia_nim
      model_name: meta/llama-3.1-8b-instruct
      priority: 80
      timeout_seconds: 30
      max_context_tokens: 131072
      capabilities:
      - chat
      - general
      - fast_response
      - chatter
      supports_native_tools: true
      supports_streaming: true
      cost_per_1k_in: 0.0001
      cost_per_1k_out: 0.0001
      description: 'NVIDIA NIM — Llama 3.1 8B Instruct. Fast NIM model for lightweight
        tasks via NVIDIA free cloud inference.

        '

    nim-deepseek-r1:
      provider: nvidia_nim
      model_name: deepseek-ai/deepseek-v4-flash
      priority: 95
      tier: deep
      timeout_seconds: 120
      max_context_tokens: 131072
      capabilities:
      - reasoning
      - coding
      - analysis
      - math
      supports_streaming: true
      cost_per_1k_in: 0.0008
      cost_per_1k_out: 0.002
      description: 'NVIDIA NIM — DeepSeek V4 Pro. Primary deep reasoning and math
        model via NVIDIA free cloud inference.

        '

    nim-mistral-large:
      provider: nvidia_nim
      model_name: mistralai/mistral-large-3-675b-instruct-2512
      priority: 88
      timeout_seconds: 180
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - coding
      - writing
      - analysis
      supports_native_tools: true
      supports_streaming: true
      cost_per_1k_in: 0.002
      cost_per_1k_out: 0.006
      description: 'NVIDIA NIM — Mistral Large 3 675B. Primary writing and frontier
        reasoning model via NVIDIA free cloud inference.

        '

    nim-embed:
      provider: nvidia_nim
      model_name: nvidia/llama-nemotron-embed-1b-v2
      embedding_model: true
      priority: 60
      timeout_seconds: 30
      max_context_tokens: 8192
      capabilities:
      - embedding
      - rag
      description: 'NVIDIA NIM — Llama Nemotron Embed 1B v2. Multilingual text embeddings
        for RAG memory (26 languages, 8192 token context).

        '

    # --- OpenCode model profiles ---------------------------------------
    oc-deepseek-flash:
      provider: opencode_zen
      model_name: deepseek-v4-flash-free
      priority: 110
      timeout_seconds: 120
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - analysis
      - planning
      - general
      - chatter
      - sovereign
      - memory
      - autonomous_planning
      supports_streaming: true
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      description: 'PRIMARY — OpenCode DeepSeek V4 Flash (free). Default model for
        all VIKI operations via OpenCode Zen.

        '

    oc-deepseek-flash-fast:
      provider: opencode_zen
      model_name: deepseek-v4-flash-free
      priority: 96
      tier: fast
      timeout_seconds: 30
      max_context_tokens: 131072
      capabilities:
      - chat
      - fast_response
      - general
      - chatter
      supports_streaming: true
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      description: 'OpenCode DeepSeek V4 Flash (free) — fast-tier alias for reflex
        and lightweight tasks (short timeout).

        '

    oc-gpt55:
      provider: opencode_zen
      model_name: gpt-5.5
      priority: 94
      timeout_seconds: 120
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - planning
      - general
      - chatter
      - sovereign
      - memory
      - autonomous_planning
      supports_streaming: true
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      description: 'OpenCode Zen — GPT-5.5. Premium coding and sovereign intelligence model.

        '

    oc-qwen37:
      provider: opencode_go
      model_name: qwen3.7-plus
      priority: 91
      timeout_seconds: 120
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - coding
      - general
      - training
      - dataset_generation
      supports_streaming: true
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      description: 'OpenCode Go — Qwen 3.7 Plus. Zero-cost coding and training engine.

        '

    oc-deepseek:
      provider: opencode_go
      model_name: deepseek-v4-pro
      priority: 97
      tier: heavy
      timeout_seconds: 180
      max_context_tokens: 131072
      capabilities:
      - reasoning
      - coding
      - math
      - self_reflection
      - analysis
      supports_streaming: true
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      description: 'OpenCode Go — DeepSeek V4 Pro. Zero-cost deep reasoning model.

        '

    oc-mimo:
      provider: opencode_go
      model_name: mimo-v2.5
      priority: 87
      timeout_seconds: 90
      max_context_tokens: 32768
      capabilities:
      - chat
      - general
      - writing
      - self_reflection
      supports_streaming: true
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      description: 'OpenCode Go — MiMo v2.5. Zero-cost writing and prompt reflection.

        '

  routing:
    prefer_local_models: false
    fallback_order:
    - oc-deepseek-flash
    - oc-deepseek
    - oc-gpt55
    - oc-qwen37
    - oc-mimo
    - nim-nemotron
    - nim-deepseek-r1
    - nim-mistral-large
    - nim-llama4
    - nim-llama-fast
    - nim-nemotron-nano
    - gemma4
    - viki-evolved
    - phi3-mini
    - gpt-5
    - claude-sonnet
    task_routes:
      coding:
        primary: oc-deepseek-flash
        fallback:
        - oc-deepseek
        - oc-qwen37
        - nim-nemotron
        - gemma4
      reasoning:
        primary: oc-deepseek
        fallback:
        - oc-deepseek-flash
        - oc-gpt55
        - nim-deepseek-r1
        - nim-nemotron
        - gemma4
      math:
        primary: oc-deepseek
        fallback:
        - oc-deepseek-flash
        - nim-deepseek-r1
        - gemma4
      training:
        primary: oc-qwen37
        fallback:
        - viki-trainer
      dataset_generation:
        primary: oc-qwen37
        fallback:
        - viki-trainer
      self_reflection:
        primary: oc-mimo
        fallback:
        - oc-deepseek
        - viki-trainer
      fast:
        primary: oc-deepseek-flash-fast
        fallback:
        - nim-nemotron-nano
        - nim-llama-fast
        - gemma4
      writing:
        primary: oc-deepseek-flash
        fallback:
        - oc-mimo
        - nim-mistral-large
        - gemma4
      vision:
        primary: nim-llama4
        fallback:
        - oc-deepseek-flash
      embedding:
        primary: nim-embed
      general:
        primary: oc-deepseek-flash
        fallback:
        - oc-mimo
        - nim-llama-fast
        - gemma4
      planning:
        primary: oc-deepseek-flash
        fallback:
        - oc-gpt55
        - oc-deepseek
        - nim-nemotron
        - gemma4
  memory:
    enabled: true
    backend: local
    path: ./memory
  logging:
    enabled: true
    level: info
    save_model_usage: true
    save_tool_calls: true
  budget:
    monthly_limit_usd: 50.0
    warning_threshold_usd: 40.0
    hard_limit_usd: 50.0
    emergency_local_only: false
