      cost_per_1k_out: 0.0
      description: 'OpenCode Go — MiMo v2.5. Zero-cost writing and reflection.'

  routing:
    prefer_local_models: true
    fallback_order:
    - lmstudio-gemma4e4b
    - lmstudio-qwen3
    - oc-deepseek-flash
    - oc-deepseek
    - nim-nemotron
    - nim-llama-fast
    - gpt-5
    - claude-sonnet
    task_routes:
      coding:
        primary: lmstudio-gemma4e4b
        fallback:
        - lmstudio-qwen3
        - oc-deepseek-flash
        - oc-deepseek
      reasoning:
        primary: lmstudio-gemma4e4b
        fallback:
        - lmstudio-qwen3
        - oc-deepseek
        - oc-deepseek-flash
      math:
        primary: lmstudio-gemma4e4b
        fallback:
        - lmstudio-qwen3
        - oc-deepseek
      training:
        primary: oc-qwen37
        fallback:
        - oc-deepseek
      dataset_generation:
        primary: oc-qwen37
        fallback:
        - oc-deepseek
      self_reflection:
        primary: lmstudio-qwen3
        fallback:
        - lmstudio-gemma4e4b
        - oc-mimo
      fast:
        primary: nim-nemotron-nano
        fallback:
        - lmstudio-gemma4e4b
        - oc-deepseek-flash-fast
      writing:
        primary: lmstudio-qwen3
        fallback:
        - lmstudio-gemma4e4b
        - oc-deepseek-flash
      vision:
        primary: lmstudio-gemma4e4b
        fallback:
        - nim-llama4
        - oc-deepseek-flash
      embedding:
        primary: nim-embed
      general:
        primary: lmstudio-gemma4e4b
        fallback:
        - lmstudio-qwen3
        - oc-deepseek-flash
      planning:
        primary: lmstudio-qwen3
        fallback:
        - lmstudio-gemma4e4b
        - oc-deepseek-flash
  memory:
    enabled: true
    backend: local
    path: ./memory
  logging:
    enabled: true
    level: info
    save_model_usage: true
    save_tool_calls: true
  budget:
    monthly_limit_usd: 50.0
    warning_threshold_usd: 40.0
    hard_limit_usd: 50.0
    emergency_local_only: false
