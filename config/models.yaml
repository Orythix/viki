models:
  providers:
    ollama:
      type: local
      base_url: http://localhost:11434
    openai:
      type: api
      api_key: ${OPENAI_API_KEY}
    anthropic:
      type: anthropic
      api_key: ${ANTHROPIC_API_KEY}
    mock:
      type: mock
  default: phi3-mini
  profiles:
    gemma4:
      provider: ollama
      model_name: gemma4:12b
      priority: 100
      timeout_seconds: 120
      max_context_tokens: 32768
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - general
      - chatter
      supports_native_tools: true
      supports_streaming: true
      local_first: true
      ollama_options:
        num_predict: 2048
        num_ctx: 8192
      description: 'Primary sovereign local model for all standard operations.

        '
    viki-evolved:
      provider: ollama
      model_name: gemma4:12b
      priority: 90
      timeout_seconds: 180
      max_context_tokens: 32768
      capabilities:
      - chat
      - reasoning
      - sovereign
      - memory
      - autonomous_planning
      - general
      supports_native_tools: true
      supports_streaming: true
      ollama_options:
        num_predict: 4096
        num_ctx: 16384
      description: 'Enhanced reasoning model with evolved VIKI persona (uses gemma4:12b).

        '
    phi3-mini:
      provider: ollama
      model_name: phi3:mini
      priority: 70
      timeout_seconds: 60
      max_context_tokens: 8192
      capabilities:
      - chat
      - general
      - chatter
      - fast_response
      supports_streaming: true
      tier: fast
      ollama_enable_thinking: false
      ollama_options:
        num_predict: 1024
        num_ctx: 4096
      description: 'Fast lightweight model (3.8B, 2.2GB) for quick responses and low-RAM environments.

        '
    viki-trainer:
      provider: ollama
      model_name: gemma4:12b
      training_only: true
      priority: 10
      timeout_seconds: 300
      capabilities:
      - training
      - dataset_generation
      - self_reflection
      description: 'Dedicated training and evolutionary refinement model.

        '
    gpt-5:
      provider: openai
      model_name: gpt-5
      priority: 50
      fallback: true
      capabilities:
      - reasoning
      - coding
      - planning
      - tool_use
      supports_native_tools: true
      supports_streaming: true
      description: 'Cloud reasoning fallback model for difficult tasks.

        '
    claude-sonnet:
      provider: anthropic
      model_name: claude-sonnet-4
      priority: 40
      fallback: true
      capabilities:
      - reasoning
      - writing
      - analysis
      supports_streaming: true
      description: 'Long-context analysis and writing model.

        '
  routing:
    prefer_local_models: true
    fallback_order:
    - phi3-mini
    - viki-evolved
    - gemma4
    - gpt-5
    - claude-sonnet
    task_routes:
      coding:
        primary: gemma4
        fallback:
        - gpt-5
      reasoning:
        primary: viki-evolved
        fallback:
        - gemma4
        - gpt-5
        - claude-sonnet
      training:
        primary: viki-trainer
      fast:
        primary: phi3-mini
        fallback:
        - gemma4
      writing:
        primary: gemma4
        fallback:
        - gpt-5
  memory:
    enabled: true
    backend: local
    path: ./memory
  logging:
    enabled: true
    level: info
    save_model_usage: true
    save_tool_calls: true
  budget:
    monthly_limit_usd: 5.0
    warning_threshold_usd: 3.5
    hard_limit_usd: 5.0
    emergency_local_only: true
