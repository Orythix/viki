models:
  providers:
    openai:
      type: api
      api_key: ${OPENAI_API_KEY}
    anthropic:
      type: anthropic
      api_key: ${ANTHROPIC_API_KEY}
    nvidia_nim:
      type: nvidia_nim
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
    opencode_zen:
      type: opencode
      base_url: https://opencode.ai/zen/v1
      api_key_env: OPENCODE_API_KEY
    opencode_go:
      type: opencode
      base_url: https://opencode.ai/zen/go/v1
      api_key_env: OPENCODE_API_KEY
    lmstudio:
      type: api
      base_url: http://localhost:1234/v1
      api_key_env: LMSTUDIO_API_KEY
    ollama:
      type: ollama
      base_url: http://localhost:11434/v1
    gemini:
      type: gemini
      api_key_env: GEMINI_API_KEY
    mock:
      type: mock
  default: lmstudio-gemma4e4b

  profiles:
    lmstudio-gemma4e4b:
      provider: lmstudio
      model_name: google/gemma-4-e4b
      priority: 30
      timeout_seconds: 120
      max_context_tokens: 8192
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - general
      - vision
      - multimodal
      supports_native_tools: true
      supports_streaming: true
      local_first: true
      description: 'Local LM Studio — Google Gemma 4 E4B. Optimized context window for smooth local execution.'

    lmstudio-gemma4e4b-8gb:
      provider: lmstudio
      model_name: google/gemma-4-e4b
      priority: 35
      timeout_seconds: 120
      max_context_tokens: 4096
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - general
      supports_native_tools: true
      supports_streaming: true
      local_first: true
      description: 'Local LM Studio — Gemma 4 E4B (8GB RAM Optimized). Conservative 4k context window to save VRAM/RAM.'

    lmstudio-deepseek-r1-14b-8gb:
      provider: lmstudio
      model_name: deepseek-r1-distill-qwen-14b
      priority: 40
      timeout_seconds: 180
      max_context_tokens: 4096
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - planning
      supports_native_tools: true
      supports_streaming: true
      local_first: true
      description: 'Local LM Studio (100% Offline 8GB RAM) — DeepSeek-R1 14B (Q3_K_M GGUF). High-tier reasoning fitting inside ~4.2GB local RAM.'

    lmstudio-qwen2.5-14b-16gb:
      provider: lmstudio
      model_name: qwen2.5-coder-14b-instruct
      priority: 42
      timeout_seconds: 180
      max_context_tokens: 8192
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - planning
      supports_native_tools: true
      supports_streaming: true
      local_first: true
      description: 'Local LM Studio (100% Offline 16GB RAM) — Qwen 2.5 Coder 14B (Q4_K_M GGUF). Full coding intelligence fitting inside ~7.8GB local RAM.'


    lmstudio-qwen3:
      provider: lmstudio
      model_name: qwen/qwen3.5-9b
      priority: 22
      timeout_seconds: 90
      max_context_tokens: 8192
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - general
      - writing
      - planning
      - self_reflection
      supports_native_tools: true
      supports_streaming: true
      local_first: true
      description: 'Local LM Studio — Qwen3.5 9B.'

    remote-100gb-server:
      provider: lmstudio
      model_name: deepseek-r1-671b
      priority: 45
      timeout_seconds: 300
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - general
      - planning
      supports_native_tools: true
      supports_streaming: true
      local_first: false
      description: 'Offloaded Remote GPU Server / Cloud Inference — 100GB+ Models (DeepSeek-R1 671B / Llama 405B) with zero local RAM impact on 8GB/16GB machines.'

    ollama-llama3:
      provider: ollama
      model_name: llama3.1:8b
      priority: 32
      timeout_seconds: 120
      max_context_tokens: 8192
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      supports_streaming: true
      local_first: true
      description: 'Local Ollama endpoint — Llama 3.1 8B.'

    gemini-2-5-flash:
      provider: gemini
      model_name: gemini-2.5-flash
      priority: 48
      fallback: true
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - multimodal
      supports_streaming: true
      description: 'Google Gemini 2.5 Flash API.'

    gemini-2-5-pro:
      provider: gemini
      model_name: gemini-2.5-pro
      priority: 49
      fallback: true
      capabilities:
      - chat
      - reasoning
      - coding
      - planning
      supports_streaming: true
      description: 'Google Gemini 2.5 Pro API.'

    claude-3-7-sonnet:
      provider: anthropic
      model_name: claude-3-7-sonnet-20250219
      priority: 50
      fallback: true
      capabilities:
      - reasoning
      - coding
      - writing
      - planning
      supports_streaming: true
      description: 'Anthropic Claude 3.7 Sonnet API.'

    gpt-4o:
      provider: openai
      model_name: gpt-4o
      priority: 47
      fallback: true
      capabilities:
      - chat
      - reasoning
      - coding
      - vision
      supports_streaming: true
      description: 'OpenAI GPT-4o API.'




    gpt-5:
      provider: openai
      model_name: gpt-5
      priority: 50
      fallback: true
      capabilities:
      - reasoning
      - coding
      - planning
      - tool_use
      supports_native_tools: true
      supports_streaming: true
      description: 'Cloud reasoning fallback model for difficult tasks.'

    claude-sonnet:
      provider: anthropic
      model_name: claude-sonnet-4
      priority: 40
      fallback: true
      capabilities:
      - reasoning
      - writing
      - analysis
      supports_streaming: true
      description: 'Long-context analysis and writing model.'

    # --- NVIDIA NIM profiles -------------------------------------------
    # NOTE: Some NVIDIA-hosted models (e.g. nvidia/llama-3.1-nemotron-ultra-253b-v1)
    # require account-level activation at https://build.nvidia.com before use.
    # The profiles below use universally accessible models by default.
    # To switch to a gated model, update model_name and visit build.nvidia.com to enable it.
    nim-nemotron:
      provider: nvidia_nim
      model_name: nvidia/llama-3.3-nemotron-super-49b-v1
      priority: 100
      timeout_seconds: 120
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - analysis
      - planning
      - general
      - chatter
      - sovereign
      - memory
      - autonomous_planning
      supports_native_tools: true
      supports_streaming: true
      cost_per_1k_in: 0.0004
      cost_per_1k_out: 0.0012
      description: 'FALLBACK — NVIDIA NIM Nemotron Super 49B. Backup cloud model.'

    nim-qwen-coder:
      provider: nvidia_nim
      model_name: qwen/qwen2.5-coder-32b-instruct
      priority: 95
      tier: heavy
      timeout_seconds: 180
      max_context_tokens: 32768
      capabilities:
      - coding
      - reasoning
      - analysis
      - tool_use
      supports_streaming: true
      cost_per_1k_in: 0.0002
      cost_per_1k_out: 0.0002
      description: 'NVIDIA NIM — Qwen2.5 Coder 32B. Heavy-tier coding model.'

    nim-nemotron-nano:
      provider: nvidia_nim
      model_name: nvidia/llama-3.1-nemotron-nano-8b-v1
      priority: 92
      tier: fast
      timeout_seconds: 30
      max_context_tokens: 131072
      capabilities:
      - chat
      - fast_response
      - general
      - chatter
      supports_streaming: true
      cost_per_1k_in: 0.0001
      cost_per_1k_out: 0.0001
      description: 'NVIDIA NIM — Nemotron Nano 8B. Primary fast-path model.'

    nim-llama4:
      provider: nvidia_nim
      model_name: meta/llama-4-maverick-17b-128e-instruct
      priority: 90
      timeout_seconds: 60
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - vision
      - multimodal
      - tool_use
      supports_native_tools: true
      supports_streaming: true
      cost_per_1k_in: 0.0002
      cost_per_1k_out: 0.0006
      description: 'NVIDIA NIM — Llama 4 Maverick 17B. Primary multimodal model.'

    nim-llama-fast:
      provider: nvidia_nim
      model_name: meta/llama-3.1-8b-instruct
      priority: 80
      timeout_seconds: 30
      max_context_tokens: 131072
      capabilities:
      - chat
      - general
      - fast_response
      - chatter
      supports_native_tools: true
      supports_streaming: true
      cost_per_1k_in: 0.0001
      cost_per_1k_out: 0.0001
      description: 'NVIDIA NIM — Llama 3.1 8B Instruct. Fast lightweight model.'

    nim-deepseek-r1:
      provider: nvidia_nim
      model_name: deepseek-ai/deepseek-v4-flash
      priority: 95
      tier: deep
      timeout_seconds: 120
      max_context_tokens: 131072
      capabilities:
      - reasoning
      - coding
      - analysis
      - math
      supports_streaming: true
      cost_per_1k_in: 0.0008
      cost_per_1k_out: 0.002
      description: 'NVIDIA NIM — DeepSeek V4 Pro. Primary deep reasoning model.'

    nim-mistral-large:
      provider: nvidia_nim
      model_name: mistralai/mistral-large-3-675b-instruct-2512
      priority: 88
      timeout_seconds: 180
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - coding
      - writing
      - analysis
      supports_native_tools: true
      supports_streaming: true
      cost_per_1k_in: 0.002
      cost_per_1k_out: 0.006
      description: 'NVIDIA NIM — Mistral Large 3 675B. Primary writing model.'

    nim-embed:
      provider: nvidia_nim
      model_name: nvidia/llama-nemotron-embed-1b-v2
      embedding_model: true
      priority: 60
      timeout_seconds: 30
      max_context_tokens: 8192
      capabilities:
      - embedding
      - rag
      description: 'NVIDIA NIM — Llama Nemotron Embed 1B v2. Multilingual embeddings.'

    # --- OpenCode model profiles ---------------------------------------
    oc-deepseek-flash:
      provider: opencode_zen
      model_name: deepseek-v4-flash-free
      priority: 110
      timeout_seconds: 120
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - coding
      - tool_use
      - analysis
      - planning
      - general
      - chatter
      - sovereign
      - memory
      - autonomous_planning
      supports_streaming: true
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      description: 'PRIMARY — OpenCode DeepSeek V4 Flash (free). Default model via OpenCode Zen.'

    oc-deepseek-flash-fast:
      provider: opencode_zen
      model_name: deepseek-v4-flash-free
      priority: 96
      tier: fast
      timeout_seconds: 30
      max_context_tokens: 131072
      capabilities:
      - chat
      - fast_response
      - general
      - chatter
      supports_streaming: true
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      description: 'OpenCode DeepSeek V4 Flash (free) — fast-tier alias.'

    oc-gpt55:
      provider: opencode_zen
      model_name: gpt-5.5
      priority: 94
      timeout_seconds: 120
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - planning
      - general
      - chatter
      - sovereign
      - memory
      - autonomous_planning
      supports_streaming: true
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      description: 'OpenCode Zen — GPT-5.5. Premium coding model.'

    oc-qwen37:
      provider: opencode_go
      model_name: qwen3.7-plus
      priority: 91
      timeout_seconds: 120
      max_context_tokens: 131072
      capabilities:
      - chat
      - reasoning
      - coding
      - general
      - training
      - dataset_generation
      supports_streaming: true
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      description: 'OpenCode Go — Qwen 3.7 Plus. Zero-cost coding and training.'

    oc-deepseek:
      provider: opencode_go
      model_name: deepseek-v4-pro
      priority: 97
      tier: heavy
      timeout_seconds: 180
      max_context_tokens: 131072
      capabilities:
      - reasoning
      - coding
      - math
